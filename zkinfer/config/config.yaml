# Canonical runtime defaults. Experiment YAML overrides these research settings.
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

coordinator:
  host: localhost
  port: 50051
  grpc_thread_pool_size: 8 # Short control-plane RPCs, not native proving threads.
  runs_dir: experiments/runs/requests
  logs_dir: logs/coordinator
  state_db_path: experiments/runs/coordinator_state.sqlite3

node:
  node_id: null # Auto-detect when unset.
  runs_dir: experiments/runs/requests
  logs_dir: logs/nodes
  runtime_state_dir: storage/node/runtime # Stage reservations and admission history.
  job_poll_interval_sec: 0.5

partitioning:
  enabled: true
  size: 1 # Consecutive ONNX operators per job.
  simplify: true
  max_propagated_scale: 0 # Only propagate incoming fixed-point scales <= this cap.
  allow_boundary_rescale: true # Permit deterministic, verified conversion to consumer scale.

preparation:
  dispatch: streaming # batch waits for all witnesses; streaming releases ready jobs.
  workers: 1 # Concurrent request preparations, not Rayon threads.
  max_pending: 8 # Waiting requests; reject new submissions when full.

scheduling:
  policy: resource_aware # fifo | lpt | resource_aware
  max_concurrent_jobs: 1 # null requires memory admission.
  memory_admission: disabled # disabled | whole_job | stage
  memory_reserve_gib: 8
  history_percentile: 0.90 # Conservative stage estimate; sparse history uses maximum.

resources:
  coordinator_threads: null # Native Rayon pool for preparation and verification.
  prover_threads: null # Rayon pool per prover process. null = automatic.

proving:
  key_representation: full # full | reduced | compact (newly generated keys).

cache:
  path: storage/cache
  circuits: true # Reuse compatible calibrated settings and compiled circuits.
  keys: true # Independently reuse compatible proving and verification keys.

resource_model:
  use_history: true # Read estimates for scheduling and admission.
  update_history: true # Persist new observations independently.
  path: null # Default: alongside cached partition artifacts.

profiling:
  mode: research # basic | research | debug
  sampling_interval_sec: 0.1 # RSS/CPU sampling; stage timestamps are independent.

verification:
  srs_dir: srs
  trusted_vk_manifest: null # Optional setup identity -> trusted VK SHA-256 mapping.

storage:
  request_path: storage/requests # Shared filesystem; separate from reusable artifacts.

jobs:
  max_retries: 1

heartbeat:
  interval_sec: 15
  timeout_sec: 60

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
