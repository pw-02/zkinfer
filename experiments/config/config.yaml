# Edit this file, then run: bash experiments/scripts/launch_tmux.sh
# Logs, measurements and reports are always retained in experiments/runs/.

workload: mnist_classifier # Name of a YAML file in config/workload/ (without .yaml).

partitioning:
  enabled: true # false proves the entire model as one job.
  size: 1 # Number of consecutive ONNX operators per partition.
  simplify: true
  # upfront: exact public linking; independent: legacy ORT inputs (unlinked).
  witness_preparation: independent
  max_propagated_scale: 16
  allow_boundary_rescale: true

scheduling:
  policy: resource_aware # fifo | lpt | cache_aware | resource_aware
  max_concurrent_jobs: 1 # 1 = isolated; null = admission-controlled concurrency.
  memory_admission: disabled # disabled | whole_job | stage
  memory_reserve_gib: 8 # RAM reserved for the OS and other processes.

cache:
  setup: true # false = regenerate circuit and keys for every job.
  profiles: true # false = do not reuse profiles from previous experiments.

profiling:
  mode: research # basic | research | debug (retains extra diagnostic files).
  sampling_interval_sec: 0.1 # CPU/RSS sampling interval in seconds.

output:
  keep_proofs: false # false = remove request-owned bulky data after success.
  keep_cache: true # false = use fresh run-owned caches, then delete them on success.
                   # Existing persistent caches are never deleted by this setting.
