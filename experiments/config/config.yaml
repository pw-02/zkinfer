# Edit this file, then run: bash experiments/scripts/launch_tmux.sh
# Logs, measurements and reports are always retained in experiments/runs/.

workload: nano_gpt_4_layers_64_embd # Name of a YAML file in config/workload/ (without .yaml). options: mobilenet_v2, nano_gpt_4_layers_64_embd

partitioning:
  enabled: false # false proves the entire model as one job.
  size: 1 # Number of consecutive ONNX operators per partition.
  simplify: true
  # Fixed-point scale propagation cap; 0 means positive incoming scales use local calibration.
  max_propagated_scale: 0
  # Allow deterministic verified conversion between producer and consumer scales.
  allow_boundary_rescale: true

preparation:
  dispatch: streaming # batch | streaming
  workers: 1 # Concurrent request preparations; independent of proof workers.
  max_pending: 8 # Waiting preparations; reject new requests when full.

scheduling:
  policy: fifo # fifo | lpt | resource_aware
  max_concurrent_jobs: 1 # 1 = isolated; null = admission-controlled concurrency.
  memory_admission: disabled # disabled | whole_job | stage
  memory_reserve_gib: 8 # RAM reserved for the OS and other processes.

proving:
  key_representation: full # full | reduced | compact (newly generated keys).
  evict_pk_page_cache: false # Linux: flush and request eviction of only the PK before proving.

cache:
  # true: reuse compatible artifacts, or generate and cache if missing.
  # false: regenerate without reading or updating that artifact cache.
  circuits: true # Calibrated settings and compiled circuits.
  keys: false # Proving and verification keys.

resources:
  coordinator_threads: null # Rayon pool for preparation and verification; null = auto.
  prover_threads: null # Rayon pool per proof subprocess; null = auto.

resource_model:
  use_history: false # Load historical estimates for scheduling and admission.
  update_history: false # Update estimates from completed jobs.

profiling:
  mode: research # basic | research | debug (retains extra diagnostic files).
  sampling_interval_sec: 5 # CPU/RSS sampling interval in seconds.

output:
  # Retain proofs and witnesses after successful execution.
  # Logs, measurements and reports are retained independently.
  keep_proofs: false
