defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# python experiments/run_local_exp.py suite.workloads='[mnist_classifier,mobilenet_v2]'
suite:
  workloads:
    # - mnist_classifier, 
     - mnist_gan
    #  - mobilenet_v2
    # - mnist_gan

execution:
  split_mode: fixed #none, fixed, auto
  ops_per_chunk: 1
  simplify_model: false

jobs:
  scheduler: lpt

launch:
  num_workers: 1
  coordinator_host: localhost
  coordinator_port: 50051
  coordinator_ready_timeout_sec: 30
  worker_startup_delay_sec: 1
  shutdown_when_done: true
  poll_completion_interval_sec: 5

paths:
  runs_dir: experiments/runs
hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE